name: Future Assinador Windows build

on:
  push:
    branches:
      - feat/future-assinador-windows-store
    paths:
      - "tools/FutureAssinadorWindows/**"
      - ".github/workflows/future-assinador-windows-build.yml"
  pull_request:
    paths:
      - "tools/FutureAssinadorWindows/**"
      - ".github/workflows/future-assinador-windows-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore tools/FutureAssinadorWindows/FutureAssinadorWindows.csproj
      - name: Build
        run: dotnet build tools/FutureAssinadorWindows/FutureAssinadorWindows.csproj --configuration Release --no-restore
      - name: Publish self-contained Windows x64
        run: dotnet publish tools/FutureAssinadorWindows/FutureAssinadorWindows.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/FutureAssinadorWindows
      - uses: actions/upload-artifact@v4
        with:
          name: FutureAssinadorWindows-win-x64
          path: artifacts/FutureAssinadorWindows/**
          if-no-files-found: error
