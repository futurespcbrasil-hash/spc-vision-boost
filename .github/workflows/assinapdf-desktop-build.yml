name: AssinaPDF Desktop - Windows x64

on:
  push:
    branches:
      - main
      - feat/assinapdf-desktop-foundation
    paths:
      - "apps/assinapdf-desktop/**"
      - ".github/workflows/assinapdf-desktop-build.yml"
  pull_request:
    paths:
      - "apps/assinapdf-desktop/**"
      - ".github/workflows/assinapdf-desktop-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore apps/assinapdf-desktop/src/AssinaPDF.Desktop/AssinaPDF.Desktop.csproj

      - name: Review vulnerable dependencies
        run: dotnet list apps/assinapdf-desktop/src/AssinaPDF.Desktop/AssinaPDF.Desktop.csproj package --vulnerable --include-transitive

      - name: Build
        run: dotnet build apps/assinapdf-desktop/src/AssinaPDF.Desktop/AssinaPDF.Desktop.csproj --configuration Release --no-restore

      - name: Publish self-contained Windows x64
        run: dotnet publish apps/assinapdf-desktop/src/AssinaPDF.Desktop/AssinaPDF.Desktop.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true --output artifacts/assinapdf/win-x64

      - name: Create SHA-256 checksums
        shell: pwsh
        run: |
          $root = (Resolve-Path 'artifacts/assinapdf/win-x64').Path
          Get-ChildItem $root -File -Recurse |
            Where-Object { $_.Name -ne 'SHA256SUMS.txt' } |
            ForEach-Object {
              $relative = $_.FullName.Substring($root.Length + 1)
              "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $relative"
            } |
            Set-Content -Path (Join-Path $root 'SHA256SUMS.txt') -Encoding ascii

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AssinaPDF-desktop-win-x64-prototype
          path: artifacts/assinapdf/win-x64/
          if-no-files-found: error
          retention-days: 14
