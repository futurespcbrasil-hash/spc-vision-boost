name: AssinaPDF Desktop - Windows x64

on:
  push:
    branches:
      - main
    paths:
      - "apps/assinapdf-desktop/**"
      - ".github/workflows/assinapdf-desktop-build.yml"
  pull_request:
    paths:
      - "apps/assinapdf-desktop/**"
      - ".github/workflows/assinapdf-desktop-build.yml"
  workflow_dispatch:

concurrency:
  group: assinapdf-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore apps/assinapdf-desktop/src/AssinaPDF.Desktop/AssinaPDF.Desktop.csproj

      - name: Review vulnerable dependencies
        run: dotnet list apps/assinapdf-desktop/src/AssinaPDF.Desktop/AssinaPDF.Desktop.csproj package --vulnerable --include-transitive

      - name: Test PAdES signing
        run: dotnet test apps/assinapdf-desktop/tests/AssinaPDF.Desktop.Tests/AssinaPDF.Desktop.Tests.csproj --configuration Release

      - name: Build
        run: dotnet build apps/assinapdf-desktop/src/AssinaPDF.Desktop/AssinaPDF.Desktop.csproj --configuration Release --no-restore

      - name: Publish self-contained Windows x64
        run: dotnet publish apps/assinapdf-desktop/src/AssinaPDF.Desktop/AssinaPDF.Desktop.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true --output artifacts/assinapdf/win-x64

      - name: Build Windows x64 MSI installer
        shell: pwsh
        run: |
          $publishDir = "$env:GITHUB_WORKSPACE\artifacts\assinapdf\win-x64\"
          dotnet build apps/assinapdf-desktop/installer/AssinaPDF.Installer.wixproj --configuration Release "-p:PublishDir=$publishDir" "-p:OutputPath=$env:GITHUB_WORKSPACE\artifacts\assinapdf\installer\"

      - name: Verify MSI package
        shell: pwsh
        run: |
          $msi = Get-ChildItem 'artifacts/assinapdf/installer' -Filter '*.msi' -File
          if (-not $msi) { throw 'O instalador MSI não foi gerado.' }
          if (($msi | Measure-Object -Property Length -Sum).Sum -lt 1000000) { throw 'O instalador MSI está inesperadamente pequeno.' }

      - name: Write artifact instructions
        shell: pwsh
        run: |
          $readme = @'
          AssinaPDF Desktop — Windows x64 (build de desenvolvimento)

          Conteúdo:
          - win-x64/AssinaPDF.exe: aplicativo desktop self-contained.
          - installer/AssinaPDF-Setup-x64.msi: instalador Windows x64.
          - SHA256SUMS.txt: checksums SHA-256 de todos os arquivos do pacote.

          IMPORTANTE:
          - Build de teste, ainda não aprovado para distribuição a clientes.
          - O MSI exige permissão de administrador.
          - O Microsoft Edge WebView2 Runtime precisa estar instalado.
          - O instalador ainda não possui assinatura Authenticode da Future Soluções.
          - Teste com PDFs e certificados reais e valide as assinaturas em ferramenta independente antes de uso oficial.
          '@
          $readme | Set-Content 'artifacts/assinapdf/LEIA-ME.txt' -Encoding utf8

      - name: Create SHA-256 checksums
        shell: pwsh
        run: |
          $root = (Resolve-Path 'artifacts/assinapdf').Path
          Get-ChildItem $root -File -Recurse |
            Where-Object { $_.Name -ne 'SHA256SUMS.txt' } |
            ForEach-Object {
              $relative = $_.FullName.Substring($root.Length + 1)
              "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $relative"
            } |
            Set-Content -Path (Join-Path $root 'SHA256SUMS.txt') -Encoding ascii

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AssinaPDF-desktop-win-x64-prototype
          path: artifacts/assinapdf/
          if-no-files-found: error
          retention-days: 14
