name: CRM build verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/kanban-ownership-stage-1]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run unit tests
        run: npm test -- --passWithNoTests
      - name: Build production bundle
        run: npm run build
